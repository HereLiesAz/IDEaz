# IDEaz: built, signed and published by HereLiesAz/workflows (.github/workflows/android-play-release.yml):
# the policy-safe `play` AAB (:app:bundlePlay) to Google Play on the shared tracks.
# This file is the trigger contract; the central sync replaces it with a tracker.
name: IDEaz Android Play Release
on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "webruntime/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "scripts/central-release-build.sh"
  workflow_dispatch:
permissions: {}
jobs:
  hand-off:
    runs-on: ubuntu-latest
    steps:
      - run: echo "IDEaz Android Play Release runs centrally in HereLiesAz/workflows."
