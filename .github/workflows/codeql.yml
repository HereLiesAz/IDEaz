---
name: CodeQL

on:
  workflow_dispatch:
  schedule:
    - cron: '34 8 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-languages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect CodeQL languages
        id: detect
        env:
          CONFIGURED_LANGUAGES: ${{ vars.CODEQL_LANGUAGES }}
        run: |
          if [ -n "$CONFIGURED_LANGUAGES" ]; then
            echo "languages=$CONFIGURED_LANGUAGES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          languages=()
          find . -type f \( -name '*.java' -o -name '*.kt' \) -print -quit | grep -q . && languages+=(java-kotlin)
          find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q . && languages+=(javascript-typescript)
          find . -type f -name '*.py' -print -quit | grep -q . && languages+=(python)
          find . -type f -name '*.go' -print -quit | grep -q . && languages+=(go)
          find . -type f \( -name '*.cs' -o -name '*.csproj' \) -print -quit | grep -q . && languages+=(csharp)
          find . -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print -quit | grep -q . && languages+=(c-cpp)
          test ${#languages[@]} -gt 0 || { echo 'No CodeQL-supported language detected' >&2; exit 1; }
          printf -v joined '"%s",' "${languages[@]}"
          echo "languages=[${joined%,}]" >> "$GITHUB_OUTPUT"

  analyze:
    needs: detect-languages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect-languages.outputs.languages) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Build analyzed project
        if: ${{ vars.CODEQL_BUILD_COMMAND != '' }}
        env:
          CODEQL_BUILD_COMMAND: ${{ vars.CODEQL_BUILD_COMMAND }}
        run: bash -eo pipefail -c "$CODEQL_BUILD_COMMAND"
      - uses: github/codeql-action/analyze@v4
