name: Dependency Submission

# Submits the fully resolved RELEASE RUNTIME dependency graph to GitHub so Dependabot
# evaluates the libraries that can actually ship in the APK/AAB. Test, lint, Gradle,
# AGP, and other build-tool configurations are intentionally excluded: they execute
# on an ephemeral CI runner and are not application dependencies. Submitting every
# resolvable configuration previously attributed Gradle/AGP tooling copies of Netty,
# Apache HttpClient, Commons Lang, Jackson, and Bouncy Castle to the Android app.
# That produced alerts the app could not remediate because the artifacts were not in
# its runtime graph. Build tooling remains managed through pinned action/plugin
# versions and Dependabot updates; this SBOM has one job and now tells one truth.
#
# On push to the default branch, GitHub auto-dismisses alerts whose vulnerable version
# is no longer present in the submitted graph.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # foojay-resolver was removed, so the jvmToolchain(21) request must be satisfied
      # by an installed JDK rather than auto-downloaded.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          # Regex matched against configuration names in both :app and
          # :webruntime. Keep production runtime dependencies; omit debug,
          # unit-test, instrumentation-test, lint, plugin, and tooling graphs.
          dependency-graph-include-configurations: '.*[Rr]eleaseRuntimeClasspath'
