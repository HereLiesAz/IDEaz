name: Publish AAB to Play

# Manual, signed Play-only App Bundle build + optional upload.
# The Play build type is release-grade but omits the GitHub distribution's
# external-app accessibility/overlay surface.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to release on"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: "Release status on the track"
        type: choice
        default: draft
        options: [draft, completed]
      publish:
        description: "Upload to Play? (off = build artifact only)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Guard publish against non-default branch
        if: ${{ inputs.publish && github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "Error: publish=true is only allowed from the default branch." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          TEMPLATE=$(find . -name 'google-services.json.template' -print -quit)
          if [ -n "$TEMPLATE" ]; then
            sed -e 's/{{\([^}]*\)}}/${\1}/g' "$TEMPLATE" | envsubst > "${TEMPLATE%.template}"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read package name
        id: pkg
        run: |
          APPLICATION_ID=$(grep -m1 'applicationId *=' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          test -n "$APPLICATION_ID" || { echo "Could not resolve applicationId" >&2; exit 1; }
          echo "application_id=$APPLICATION_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare Keystore from Secrets
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          test -n "$KEYSTORE_PRIVATE" && test -n "$KEYSTORE_CHAIN" || {
            echo "KEYSTORE_PRIVATE / KEYSTORE_CHAIN are required." >&2
            exit 1
          }
          printf '%s\n' "$KEYSTORE_PRIVATE" > private.key
          printf '%s\n' "$KEYSTORE_CHAIN" > chain.crt
          openssl pkcs12 -export -in chain.crt -inkey private.key -out release.keystore \
            -name "$KEY_ALIAS" -passout env:KEYSTORE_PASSWORD
          keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null
          echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed Play AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUILD_NUMBER_OVERRIDE_VAR: ${{ vars.BUILD_NUMBER_OVERRIDE }}
          PLAY_BUNDLE_COMMAND_VAR: ${{ vars.PLAY_BUNDLE_COMMAND }}
        run: |
          set -e
          test -f version.properties || { echo "version.properties is required" >&2; exit 1; }
          BUILD_NUMBER="${BUILD_NUMBER_OVERRIDE_VAR:-$(git rev-list --count HEAD)}"
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid build component" >&2; exit 1; }
          BUNDLE_COMMAND="${PLAY_BUNDLE_COMMAND_VAR:-./gradlew bundlePlay}"
          $BUNDLE_COMMAND -PversionBuild="$BUILD_NUMBER" --build-cache --stacktrace

      - name: Locate Play AAB
        id: aab
        run: |
          AAB=$(find app/build/outputs/bundle/play -name '*.aab' -print | sort | head -n 1)
          test -n "$AAB" || { echo "No Play .aab produced" >&2; exit 1; }
          echo "path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload Play AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: ideaz-play-aab
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error

      - name: Publish to Google Play
        if: ${{ inputs.publish }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.pkg.outputs.application_id }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
