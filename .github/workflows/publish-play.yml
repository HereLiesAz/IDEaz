name: Publish AAB to Play

# Manual, signed App Bundle build + (optional) upload to the Google Play Console.
#
# Safe by default: track=internal, status=draft, publish=false. With publish=false
# the job only builds and uploads the .aab as a workflow artifact — nothing reaches
# Play. Set publish=true to push it to the chosen track.
#
# Required repo secrets (see docs/build_pipeline.md §"Publishing to Google Play"):
#   KEYSTORE_PRIVATE, KEYSTORE_CHAIN, KEYSTORE_PASSWORD, KEY_ALIAS  (upload signing)
#   PLAY_SERVICE_ACCOUNT_JSON                                       (Play Publisher API)
#   GOOGLE_SERVICES_API_KEY, PROJECT_ID, CLIENT_ID                 (google-services, optional)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to release on"
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Release status on the track"
        type: choice
        default: draft
        options:
          - draft
          - completed
      publish:
        description: "Upload to Play? (off = build + attach .aab artifact only)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Guard publish against non-default branch
        # Play rejects any upload whose versionCode doesn't strictly increase,
        # and this workflow derives versionCode from git rev-list --count HEAD -
        # a feature-branch dispatch with publish=true can burn versionCodes
        # ahead of master, permanently locking master out of Play until enough
        # further commits land to exceed what the branch already claimed.
        # build-and-release.yml already guards its release publish the same
        # way; this workflow had no equivalent check.
        if: ${{ inputs.publish && github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "Error: publish=true is only allowed when dispatched from the default branch (got '${{ github.ref_name }}')." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          TEMPLATE=$(find . -name 'google-services.json.template' -print -quit)
          if [ -n "$TEMPLATE" ]; then
            sed -e 's/{{\([^}]*\)}}/${\1}/g' "$TEMPLATE" | envsubst > "${TEMPLATE%.template}"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read package name from build config
        id: pkg
        env:
          # Passed via env: rather than interpolated straight into the script -
          # $VAR is never re-parsed by the shell, unlike raw ${{ }} text
          # substitution, which would let a repo variable containing shell
          # metacharacters inject commands into this step.
          ANDROID_BUILD_FILE_VAR: ${{ vars.ANDROID_BUILD_FILE }}
        run: |
          BUILD_FILE="${ANDROID_BUILD_FILE_VAR:-app/build.gradle.kts}"
          APPLICATION_ID=$(grep -m1 'applicationId *=' "$BUILD_FILE" | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$APPLICATION_ID" ]; then
            echo "Could not read applicationId from configured Android build file" >&2
            exit 1
          fi
          echo "Resolved package name: $APPLICATION_ID"
          echo "application_id=$APPLICATION_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare Keystore from Secrets
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$KEYSTORE_PRIVATE" ] || [ -z "$KEYSTORE_CHAIN" ]; then
            echo "Error: KEYSTORE_PRIVATE / KEYSTORE_CHAIN are required to sign a release bundle." >&2
            exit 1
          fi
          echo "Reconstructing Keystore from Secrets..."
          echo "$KEYSTORE_PRIVATE" > private.key
          echo "$KEYSTORE_CHAIN" > chain.crt

          # Create PKCS12 keystore.
          openssl pkcs12 -export -in chain.crt -inkey private.key -out release.keystore \
            -name "$KEY_ALIAS" -passout env:KEYSTORE_PASSWORD

          # Verify quietly — verbose output would leak certificate metadata into the log.
          echo "Verifying generated keystore..."
          keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null

          echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> "$GITHUB_ENV"
          DELIM="DELIMITER_${{ github.run_id }}_${{ github.run_attempt }}"
          {
            printf '%s\n' "KEY_PASSWORD<<${DELIM}"
            printf '%s\n' "$KEYSTORE_PASSWORD"
            printf '%s\n' "${DELIM}"
          } >> "$GITHUB_ENV"

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # KEYSTORE_FILE / KEY_PASSWORD also exported into GITHUB_ENV above.
          # See "Read package name from build config" above for why these ride
          # in via env: rather than direct ${{ }} interpolation.
          BUILD_NUMBER_OVERRIDE_VAR: ${{ vars.BUILD_NUMBER_OVERRIDE }}
          BUNDLE_COMMAND_VAR: ${{ vars.BUNDLE_COMMAND }}
        run: |
          set -e
          test -f version.properties || { echo "version.properties is required" >&2; exit 1; }
          # -PversionBuild must be a value that only ever grows - Play Store
          # rejects any upload whose versionCode doesn't strictly increase.
          # This previously read the static `build` field out of
          # version.properties, which nothing in this pipeline ever
          # increments/commits back, so every publish attempt would try to
          # reuse the exact same versionCode as the last one.
          BUILD_NUMBER="${BUILD_NUMBER_OVERRIDE_VAR:-$(git rev-list --count HEAD)}"
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid build component" >&2; exit 1; }
          BUNDLE_COMMAND="${BUNDLE_COMMAND_VAR:-./gradlew bundleRelease}"
          $BUNDLE_COMMAND -PversionBuild=$BUILD_NUMBER --build-cache

      - name: Locate AAB
        id: aab
        run: |
          AAB=$(find . -path '*/build/outputs/bundle/*/*.aab' -print | sort | head -n 1)
          if [ -z "$AAB" ]; then
            echo "No .aab produced!" >&2
            exit 1
          fi
          echo "Found bundle: $AAB"
          echo "path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error

      - name: Publish to Google Play
        if: ${{ inputs.publish }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # ratchet:r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.pkg.outputs.application_id }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
